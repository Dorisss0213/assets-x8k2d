  /* ---------- Header ---------- */
  header.site {

  }
  header.site h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.8px; }
  header.site h1 .red { color: var(--red); }
  header.site .meta { color: var(--ink-3); font-size: 12.5px; margin-top: 8px; font-weight: 500; }

  /* ---------- Category filter ---------- */
  .filters {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin: 20px 0 4px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 16px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .chip .n {
    background: var(--neutral-soft); color: var(--ink-3);
    font-size: 11.5px; font-weight: 700;
    padding: 1px 8px; border-radius: 999px;
  }
  .chip:hover { border-color: var(--ink-2); color: var(--ink); }
  .chip.on {
    background: var(--red); border-color: var(--red); color: #fff;
  }
  .chip.on .n { background: rgba(255,255,255,.2); color: #fff; }

  /* ---------- Category section ---------- */
  section.cat { margin-top: 34px; }
  .cat-head {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 2px solid var(--ink); padding-bottom: 10px;

  .cat-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; display: flex; align-items: center; }
  .cat-head h2::before {
    content: ""; display: inline-block;
    width: 10px; height: 10px; background: var(--red);
    margin-right: 10px; flex-shrink: 0;
  }
  .cat-head .count { color: var(--ink-3); font-size: 13px; font-weight: 500; margin-left: auto; }

  /* ---------- Trend group ---------- */
  .trend { margin-top: 26px; }
  .trend-head {
    background: var(--red-soft);
    border-left: 4px solid var(--red);
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
  }
  .trend-head .t-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px;
    color: var(--red); text-transform: uppercase;
  }
  .trend-head h3 { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: -0.2px; }
  .trend-head .t-count { color: var(--ink-3); font-size: 12.5px; }
  .trend-summary {
    color: var(--ink-2); font-size: 13.5px; margin: 8px 2px 0;
  }

  /* ---------- Card grid (5-6 per row) ---------- */
  .grid {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.06); border-color: #e0e0e0; }

  /* media 3:4 */
  .media {
    position: relative;
    aspect-ratio: 3 / 4;
    background: #fafafa;
    overflow: hidden;
  }
  .media img, .media video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  /* landscape images: show complete, never crop */
  .media img.fit {
    object-fit: contain;
    background: #fff;
  }
  .media.contain img, .media.contain video { object-fit: contain; background: #fff; }

  /* carousel */
  .car { position: relative; height: 100%; }
  .car .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .car .slide.on { opacity: 1; pointer-events: auto; }
  .car .dots {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 3;
  }
  .car .dots i {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,.55); border: 1px solid rgba(0,0,0,.12);
    cursor: pointer;
  }
  .car .dots i.on { background: var(--red); border-color: var(--red); }
  .car .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,.9); border: none;
    font-size: 14px; cursor: pointer; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
  }
  .car .arrow.prev { left: 8px; }
  .car .arrow.next { right: 8px; }

  /* card body */
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .brand {
    align-self: flex-start;

  .name-cn { color: var(--ink-3); font-size: 12px; font-weight: 500; margin-top: -4px; }
  .feats { list-style: none; display: flex; flex-direction: column; gap: 4px; }

  .src { margin-top: auto; font-size: 11.5px; color: var(--ink-3); }
  .src a { color: var(--red); text-decoration: none; }
  .src a:hover { text-decoration: underline; }

  footer { margin-top: 60px; color: var(--ink-3); font-size: 12px; text-align: center; }

/* ============================================================ */

const $ = (s, el = document) => el.querySelector(s);

function mediaHTML(p) {
  const items = Array.isArray(p.media) ? p.media : [p.media];
  if (items.length === 1) return `<div class="media">${slideHTML(items[0], true)}</div>`;
  const slides = items.map((m, i) =>
    `<div class="slide${i === 0 ? " on" : ""}">${slideHTML(m, i === 0)}</div>`).join("");
  const dots = items.map((_, i) =>
    `<i class="${i === 0 ? "on" : ""}" data-i="${i}"></i>`).join("");
  return `<div class="media"><div class="car" data-car>
    ${slides}
    <div class="dots">${dots}</div>
    <button class="arrow prev" aria-label="previous">‹</button>
    <button class="arrow next" aria-label="next">›</button>
  </div></div>`;
}

function slideHTML(m, isFirst) {
  if (m.type === "video") {
    return `<video controls preload="none" playsinline${m.poster ? ` poster="${m.poster}"` : ""} src="${m.src}"></video>`;
  }
  const posStyle = m.pos ? ` style="object-position:${m.pos}"` : "";
  /* non-first slides defer loading until the slide becomes visible */
  const srcAttr = isFirst ? `src="${m.src}"` : `data-src="${m.src}"`;
  return `<img loading="lazy" ${srcAttr} alt="${m.alt || ""}"${posStyle}>`;
}

/* if the jsDelivr CDN rate-limits (403), fall back to raw.githubusercontent.com, then to local media-webp/ */
document.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName !== "IMG") return;
  if (img.src.includes("jsdelivr.net/gh/") && !img.dataset.retried) {
    img.dataset.retried = "1";
    img.src = img.src
      .replace("https://fastly.jsdelivr.net/gh/", "https://raw.githubusercontent.com/")
      .replace("https://cdn.jsdelivr.net/gh/", "https://raw.githubusercontent.com/")
      .replace(/@main\//, "/main/");
  } else if (img.dataset.retried === "1" && img.src.includes("raw.githubusercontent.com")) {
    img.dataset.retried = "2";
    img.src = "media-webp/" + img.src.split("/").pop();
  }
}, true);

function cardHTML(p) {
  return `<article class="card" id="${p.id}">
    ${mediaHTML(p)}
    <div class="body">
      <span class="brand">${p.brand}</span>
      <div class="name">${p.name}</div>
      <ul class="feats">${p.features.map(f => `<li>${f}</li>`).join("")}</ul>
      ${p.sales ? `<div class="sales">📈 ${p.sales}</div>` : ""}
      ${p.source ? `<div class="src">Source: ${p.source.url ? `<a href="${p.source.url}" target="_blank" rel="noopener">${p.source.label}</a>` : p.source.label}</div>` : ""}
    </div>
  </article>`;
}

/* ---------- category filter ---------- */
let activeCat = "all";

function renderFilters() {
  const chips = [{ id: "all", emoji: "✦", name: "All" }, ...CATEGORIES];
  $("#filters").innerHTML = chips.map(c => {
    const n = c.id === "all" ? PRODUCTS.length : PRODUCTS.filter(p => p.category === c.id).length;
    return `<button class="chip${activeCat === c.id ? " on" : ""}" data-cat="${c.id}">${c.emoji} ${c.name}<span class="n">${n}</span></button>`;
  }).join("");
}

function render() {
  const app = $("#app");
  const cats = activeCat === "all" ? CATEGORIES : CATEGORIES.filter(c => c.id === activeCat);
  let total = 0;
  app.innerHTML = cats.map(cat => {
    const catProducts = PRODUCTS.filter(p => p.category === cat.id);
    total += catProducts.length;
    const trends = TRENDS.filter(t => t.category === cat.id);
    return `<section class="cat" id="cat-${cat.id}">
      <div class="cat-head">
        <h2>${cat.emoji} ${cat.name}</h2>
        <span class="count">${catProducts.length} product${catProducts.length === 1 ? "" : "s"} · ${trends.length} trend${trends.length === 1 ? "" : "s"}</span>
      </div>
      ${trends.map(t => {
        const tps = catProducts.filter(p => p.trend === t.id);
        return `<div class="trend" id="trend-${t.id}">
          <div class="trend-head">
            <span class="t-label">Trend</span>
            <h3>${t.name}</h3>
            <span class="t-count">${tps.length} product${tps.length === 1 ? "" : "s"}</span>
          </div>
          ${t.summary ? `<div class="trend-summary">${t.summary}</div>` : ""}
          <div class="grid">${tps.map(cardHTML).join("")}</div>
        </div>`;
      }).join("")}
    </section>`;
  }).join("");

  $("#siteMeta").textContent = `${CATEGORIES.length} category · ${TRENDS.length} trend · ${PRODUCTS.length} products · showing ${total} · updated 2026-11-26`;
  fitLandscapeImages();
}

/* landscape images (width >= height) are shown complete, never cropped */
function fitImg(img) {
  const apply = () => { if (img.naturalWidth && img.naturalWidth >= img.naturalHeight) img.classList.add("fit"); };
  if (img.complete) apply();
  else img.addEventListener("load", apply, { once: true });
}
function fitLandscapeImages() {
  document.querySelectorAll(".media img[src]").forEach(fitImg);
}

/* carousel wiring (event delegation) */
document.addEventListener("click", e => {
  const dot = e.target.closest(".car .dots i");
  const arrow = e.target.closest(".car .arrow");
  if (!dot && !arrow) return;
  const car = e.target.closest(".car");
  const slides = [...car.querySelectorAll(".slide")];
  const dots = [...car.querySelectorAll(".dots i")];
  let cur = slides.findIndex(s => s.classList.contains("on"));
  let next = dot ? +dot.dataset.i
    : (cur + (arrow.classList.contains("next") ? 1 : -1) + slides.length) % slides.length;
  slides[cur].classList.remove("on");
  slides[cur].querySelectorAll("video").forEach(v => v.pause());
  slides[next].classList.add("on");
  /* hydrate deferred images on first view */
  slides[next].querySelectorAll("img[data-src]").forEach(img => {
    img.src = img.dataset.src;
    img.removeAttribute("data-src");
    fitImg(img);
  });
  dots[cur].classList.remove("on");
  dots[next].classList.add("on");
});

/* filter chips */
document.addEventListener("click", e => {
  const chip = e.target.closest(".filters .chip");
  if (!chip) return;
  activeCat = chip.dataset.cat;
  renderFilters();
  render();
  window.scrollTo({ top: 0 });
});

renderFilters();
render();
</script>
